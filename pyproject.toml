[project]
name = "roux"
version = "0.1.0"
description = "UK wraparound care platform"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["accounts", "api", "billing", "bookings", "cms", "config", "dashboard", "finance", "franchises", "notifications", "ofsted", "organisations", "public_site", "e2e", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]
"e2e/*" = ["B008"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_test.py", "*_steps.py"]
testpaths = ["accounts", "api", "billing", "bookings", "cms", "dashboard", "finance", "franchises", "notifications", "ofsted", "organisations", "public_site", "tests"]
addopts = "--strict-markers -ra"
markers = [
    "e2e: end-to-end browser tests (Playwright)",
    "integration: integration tests requiring database",
]

[tool.coverage.run]
source = ["accounts", "api", "billing", "bookings", "cms", "dashboard", "finance", "franchises", "notifications", "ofsted", "organisations", "public_site"]
omit = ["*/migrations/*", "*/tests/*", "e2e/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
