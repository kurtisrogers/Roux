site_name: Roux Documentation
site_description: Developer guide for the Roux wraparound care platform
site_url: https://kurtisrogers.github.io/Roux/docs/
repo_url: https://github.com/kurtisrogers/Roux
repo_name: kurtisrogers/Roux
edit_uri: edit/main/docs/

exclude_docs: |
  DEPLOYMENT.md
  superpowers/**

theme:
  name: material
  language: en
  logo: assets/roux-mark.svg
  favicon: assets/roux-mark.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

nav:
  - Home: index.md
  - Getting started:
    - Quick start: quick-start.md
    - Demo credentials: demo-credentials.md
    - Local URLs: local-urls.md
  - Platform:
    - Architecture: architecture.md
    - Project structure: project-structure.md
    - User roles: user-roles.md
    - Environment variables: environment.md
    - Configuration: configuration.md
  - Features:
    - Franchises & multi-tenancy: franchises.md
    - Operations module: operations.md
    - Programme planner: programme.md
    - Public site & CMS: public-site.md
    - Mobile API: api.md
  - DevOps:
    - Management commands: management-commands.md
    - Testing: testing.md
    - CI/CD: ci-cd.md
    - AWS deployment: deployment.md
  - Contributing:
    - Extending Roux: extending.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kurtisrogers/Roux
