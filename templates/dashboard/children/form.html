{% extends "base/dashboard.html" %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-header">
  <div><h1>{{ title }}</h1></div>
</div>
<section class="form-panel">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="toolbar">
      <button type="submit">Save</button>
      <a href="javascript:history.back()" role="button" class="secondary">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
