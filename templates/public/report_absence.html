{% extends "base/public.html" %}
{% block title %}Report absence — {{ organisation.name }}{% endblock %}
{% block content %}
<h1>Report absence</h1>
<p class="muted">Tell us if your child cannot attend a booked session.</p>
<form method="post" class="form-card">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn">Submit absence</button>
</form>
{% endblock %}
